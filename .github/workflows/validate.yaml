name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -fsSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: kustomize build bootstrap/
        run: kustomize build bootstrap/ > /tmp/rendered.yaml

      - name: kubeconform validate
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -kubernetes-version 1.35.0 \
            /tmp/rendered.yaml

      - name: Sanitization grep — fail if any AWS account ID / ARN / ECR hostname is committed
        run: |
          set -e
          if grep -RIn 'arn:aws:iam::[0-9]\{12\}\|[0-9]\{12\}\.dkr\.ecr' \
            --exclude-dir=.git \
            --exclude-dir=.dangeresque \
            --exclude-dir=node_modules \
            .
          then
            echo "::error::Hardcoded AWS account ID / ARN / ECR hostname detected. Use cluster Secret annotations + {{metadata.annotations.X}} templating."
            exit 1
          fi

      - name: Defense in depth — broader ARN / OIDC / network ID grep
        run: |
          set -e
          fail=0
          for pattern in \
            'arn:aws:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}' \
            'oidc\.eks\.[a-z0-9-]+\.amazonaws\.com/id/' \
            '\b(vpc|subnet|sg|igw|rtb|nat|eni)-[a-f0-9]{8,17}\b'
          do
            if grep -REIn "$pattern" \
              --exclude-dir=.git \
              --exclude-dir=.dangeresque \
              --exclude-dir=node_modules \
              .
            then
              echo "::error::Pattern matched: $pattern"
              fail=1
            fi
          done
          exit $fail
