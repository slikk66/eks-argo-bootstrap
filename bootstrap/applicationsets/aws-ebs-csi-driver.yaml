apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-ebs-csi-driver
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: aws-ebs-csi-driver-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/slikk66/eks-argo-bootstrap
          targetRevision: HEAD
          ref: values
        - chart: aws-ebs-csi-driver
          repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          targetRevision: 2.59.0
          helm:
            releaseName: aws-ebs-csi-driver
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/aws-ebs-csi-driver/values.yaml
            valuesObject:
              controller:
                serviceAccount:
                  annotations:
                    eks.amazonaws.com/role-arn: '{{metadata.annotations.ebs_csi_role_arn}}'
      destination:
        name: '{{name}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
