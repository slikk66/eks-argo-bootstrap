apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: aws-load-balancer-controller-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/slikk66/eks-argo-bootstrap
          targetRevision: HEAD
          ref: values
        - chart: aws-load-balancer-controller
          repoURL: https://aws.github.io/eks-charts
          targetRevision: v3.3.0
          helm:
            releaseName: aws-load-balancer-controller
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/aws-load-balancer-controller/values.yaml
            valuesObject:
              clusterName: '{{metadata.annotations.cluster_name}}'
              region: '{{metadata.annotations.aws_region}}'
              vpcId: '{{metadata.annotations.vpc_id}}'
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: '{{metadata.annotations.alb_role_arn}}'
      destination:
        name: '{{name}}'
        namespace: kube-system
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: aws-load-balancer-tls
          namespace: kube-system
          jsonPointers:
            - /data
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: aws-load-balancer-webhook
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: aws-load-balancer-webhook
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
