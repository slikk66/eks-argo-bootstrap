apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: external-secrets-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/slikk66/eks-argo-bootstrap
          targetRevision: HEAD
          ref: values
        - chart: external-secrets
          repoURL: https://charts.external-secrets.io
          targetRevision: 2.4.1
          helm:
            releaseName: external-secrets
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/external-secrets/values.yaml
            valuesObject:
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: '{{metadata.annotations.external_secrets_role_arn}}'
      destination:
        name: '{{name}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
