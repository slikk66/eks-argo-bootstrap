apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: {{ toJson .Values.nodePool.requirements.arch }}
        - key: kubernetes.io/os
          operator: In
          values: {{ toJson .Values.nodePool.requirements.os }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.nodePool.requirements.capacityTypes }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson .Values.nodePool.requirements.instanceCategories }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - {{ .Values.nodePool.requirements.instanceGenerationGreaterThan | quote }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: {{ .Values.nodePool.expireAfter | quote }}
  disruption:
    consolidationPolicy: {{ .Values.nodePool.consolidationPolicy }}
    consolidateAfter: {{ .Values.nodePool.consolidateAfter | quote }}
